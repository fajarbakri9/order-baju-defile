name: Assemble final site

on:
  push:
    paths:
      - ".build/assemble.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and publish final site
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/work
          cd /tmp/work
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD

          cat .build/site.part.* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site

          rm -rf .build
          rm -f .github/workflows/assemble.yml
          cp -a /tmp/site/order-baju-defile/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy final Order Baju Defile site"
          git push origin HEAD:main
