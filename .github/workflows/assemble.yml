name: Assemble final site

on:
  push:
    paths:
      - ".build/assemble.trigger"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild final site
        shell: bash
        run: |
          set -euo pipefail
          cat .build/site.part.* > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          cp -a /tmp/site/order-baju-defile/. .
          rm -rf .build
          rm -f .github/workflows/assemble.yml

      - name: Commit final site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy final Order Baju Defile site"
          git push
