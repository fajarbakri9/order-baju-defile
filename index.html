<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b56">
  <title>Order Baju Defile | Kabupaten Pinrang</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f9;color:#123b56;min-height:100vh;display:grid;place-items:center}.loader{width:min(440px,calc(100vw - 36px));background:#fff;border:1px solid #dce7ed;border-radius:22px;padding:30px;box-shadow:0 22px 60px rgba(18,59,86,.10);text-align:center}.mark{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;background:#123b56;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}.loader h1{font-size:20px;margin:0 0 8px}.loader p{margin:0;color:#6d8390;font-size:13px;line-height:1.6}.bar{height:5px;background:#eaf0f3;border-radius:99px;overflow:hidden;margin-top:22px}.bar:before{content:"";display:block;height:100%;width:36%;background:#1f7a8c;border-radius:99px;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(178%)}}.error{color:#a33b32;margin-top:14px;font-size:12px;display:none}
  </style>
</head>
<body>
  <main class="loader">
    <div class="mark">P</div>
    <h1>Order Baju Defile</h1>
    <p>Menyiapkan daftar pesanan…</p>
    <div class="bar"></div>
    <div class="error" id="error"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
  <script>
  (async()=>{
    const partNames=["01","02","03","04","05"].map(n=>`.build/site.part.${n}`);
    const parts=await Promise.all(partNames.map(async url=>{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok) throw new Error(`Gagal memuat data (${r.status})`);
      return r.text();
    }));
    const b64=parts.join("").replace(/\s+/g,"");
    const raw=atob(b64);
    const zipBytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++)zipBytes[i]=raw.charCodeAt(i);
    const unpacked=fflate.unzipSync(zipBytes);
    const root="order-baju-defile/";
    const htmlBytes=unpacked[root+"index.html"];
    if(!htmlBytes) throw new Error("Berkas halaman tidak ditemukan.");
    let html=new TextDecoder("utf-8").decode(htmlBytes);

    const sourceMatch=html.match(/const SOURCE_DATA=(\[[\s\S]*?\]);\s*\n/);
    if(sourceMatch){
      let source=JSON.parse(sourceMatch[1]);
      source=source.filter(d=>!String(d.name||"").toUpperCase().includes("HJ SUMARNI DINKOPUKM"));
      const no41=source.find(d=>Number(d.originalNo)===41 && /PAK RAHMAN\s*\(BKD\)/i.test(String(d.name||"")));
      if(no41){no41.note="L";no41.paid=true}
      source.sort((a,b)=>(Number(a.originalNo)||9999)-(Number(b.originalNo)||9999)||String(a.name||"").localeCompare(String(b.name||""),"id"));
      source.forEach((d,i)=>d.displayNo=Number(d.originalNo)||i+1);
      html=html.replace(sourceMatch[0],`const SOURCE_DATA=${JSON.stringify(source)};\n`);
    }

    html=html.replaceAll("kaosDefileData","kaosDefileDataV4");
    html=html.replace(
      '<option value="rank">Urut jabatan</option>',
      '<option value="initial">Urutan tabel awal</option><option value="rank">Urut jabatan</option>'
    );
    html=html.replace(
      'if(sort==="paid")return (+paid(y)-+paid(x))||(+x.rankWeight-+y.rankWeight);\n   return (+x.rankWeight-+y.rankWeight)||(+x.displayNo-+y.displayNo)||x.name.localeCompare(y.name,"id");',
      'if(sort==="paid")return (+paid(y)-+paid(x))||(+x.originalNo-+y.originalNo);\n   if(sort==="rank")return (+x.rankWeight-+y.rankWeight)||(+x.originalNo-+y.originalNo)||x.name.localeCompare(y.name,"id");\n   return (+x.originalNo-+y.originalNo)||x.name.localeCompare(y.name,"id");'
    );
    html=html.replace('$("#sortSelect").value="rank"','$("#sortSelect").value="initial"');

    const imageBytes=unpacked[root+"assets/kaos-defile.jpg"];
    if(imageBytes){
      let s="";
      const step=0x8000;
      for(let i=0;i<imageBytes.length;i+=step)s+=String.fromCharCode.apply(null,imageBytes.subarray(i,i+step));
      const dataUri="data:image/jpeg;base64,"+btoa(s);
      html=html.split("assets/kaos-defile.jpg").join(dataUri);
    }
    document.open();
    document.write(html);
    document.close();
  })().catch(err=>{
    console.error(err);
    const el=document.getElementById("error");
    if(el){el.style.display="block";el.textContent="Halaman gagal dimuat. Silakan muat ulang."}
  });
  </script>
</body>
</html>
