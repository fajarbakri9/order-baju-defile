<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b56">
  <title>Order Baju Defile | Kabupaten Pinrang</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f9;color:#123b56;min-height:100vh;display:grid;place-items:center}
    .loader{width:min(440px,calc(100vw - 36px));background:#fff;border:1px solid #dce7ed;border-radius:22px;padding:30px;box-shadow:0 22px 60px rgba(18,59,86,.10);text-align:center}
    .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;background:#123b56;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
    .loader h1{font-size:20px;margin:0 0 8px}.loader p{margin:0;color:#6d8390;font-size:13px;line-height:1.6}
    .bar{height:5px;background:#eaf0f3;border-radius:99px;overflow:hidden;margin-top:22px}.bar:before{content:"";display:block;height:100%;width:36%;background:#1f7a8c;border-radius:99px;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(178%)}}
    .error{color:#a33b32;margin-top:14px;font-size:12px;display:none}
  </style>
</head>
<body>
  <main class="loader">
    <div class="mark">P</div>
    <h1>Order Baju Defile</h1>
    <p>Menyiapkan daftar pesanan…</p>
    <div class="bar"></div>
    <div class="error" id="error"></div>
  </main>
  <script src="app-loader.js"></script>
</body>
</html>
